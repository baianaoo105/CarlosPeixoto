{% extends 'base.html' %}{% block content %}<section class="form-page container"><a class="back" href="{{ url_for('admin') }}">← Voltar ao painel</a><form class="panel" method="post" enctype="multipart/form-data"><p class="eyebrow">Painel administrativo</p><h1>Adicionar {{ kind }}</h1>{% if kind=='notícia' %}<label>Título<input name="title" maxlength="180" required></label><div class="two"><label>Categoria<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Região<select name="region">{% for r in regions %}<option>{{ r }}</option>{% endfor %}</select></label></div><label>Resumo<textarea name="summary" maxlength="350" required></textarea></label><label>Texto da notícia<textarea name="content" rows="10" required></textarea></label><label>Imagem (até 8 MB)<input type="file" name="image" accept="image/*"></label><label class="check"><input type="checkbox" name="featured"> Exibir como destaque</label>{% elif kind=='vídeo' %}<label>Título<input name="title" required></label><label>Descrição<textarea name="description" required></textarea></label><label>Região<select name="region">{% for r in regions %}<option>{{ r }}</option>{% endfor %}</select></label><label>Vídeo MP4, WEBM ou MOV (até 20 MB)<input type="file" name="video" accept="video/mp4,video/webm,video/quicktime" required></label>{% elif kind=='evento' %}<label>Título do evento<input name="title" maxlength="160" required></label><div class="two"><label>Data<input type="date" name="event_date" required></label><label>Horário<input type="time" name="event_time"></label></div><label>Região<select name="region">{% for r in regions %}<option>{{ r }}</option>{% endfor %}</select></label><label>Descrição<textarea name="description" maxlength="600" rows="5" required></textarea></label>{% else %}<label>Nome<input name="name" required></label><label>Profissão<select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select></label><label>Função exercida<input name="role" required></label><label>Apresentação<textarea name="description" required></textarea></label><label>Foto<input type="file" name="photo" accept="image/*"></label>{% endif %}<button class="button" type="submit">Salvar {{ kind }}</button></form></section>{% endblock %}
