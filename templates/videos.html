{% extends 'base.html' %}{% block content %}<section class="page-hero"><div class="container"><p class="eyebrow">Multimídia</p><h1>Vídeos</h1><p>Reportagens e registros de até 20 MB.</p></div></section><section class="container section"><div class="video-grid">{% for item in items %}<article class="video-card"><video controls preload="metadata" src="{{ url_for('video_file',item_id=item.id) }}"></video><div><span class="pill">{{ item.region }}</span><h2>{{ item.title }}</h2><p>{{ item.description }}</p></div></article>{% else %}<p>Nenhum vídeo publicado.</p>{% endfor %}</div></section>{% endblock %}
