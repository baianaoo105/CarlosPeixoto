{% extends 'base.html' %}
{% block title %}{{ 'Editar' if article else 'Nova' }} notícia{% endblock %}

{% block content %}
<section class="form-page container">
  <form method="post" enctype="multipart/form-data" class="panel">
    <p class="eyebrow">Painel editorial</p>
    <h1>{{ 'Editar notícia' if article else 'Cadastrar notícia' }}</h1>

    <div class="field-grid">
      <label class="wide">Título
        <input name="title" maxlength="180" value="{{ request.form.get('title', article.title if article else '') }}" required>
      </label>

      <label>Categoria
        <select name="category" required>
          <option value="">Selecione</option>
          {% for item in categories %}
          <option value="{{ item }}" {% if request.form.get('category', article.category if article else '') == item %}selected{% endif %}>{{ item }}</option>
          {% endfor %}
        </select>
      </label>

      <label>Foto (PNG, JPG, WEBP ou GIF; até 8 MB)
        <input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif">
      </label>

      <label class="wide">Profissional que forneceu a informação
        <input name="source_name" maxlength="120" value="{{ request.form.get('source_name', (article.source_name or '') if article else '') }}" placeholder="Exemplo: Dra. Marina Almeida">
        <span class="hint">Campo opcional. O nome aparecerá como crédito na página da notícia.</span>
      </label>

      <label class="wide">Resumo
        <textarea name="summary" maxlength="350" rows="3" required>{{ request.form.get('summary', article.summary if article else '') }}</textarea>
      </label>

      <label class="wide">Texto da notícia
        <textarea name="content" rows="12" required>{{ request.form.get('content', article.content if article else '') }}</textarea>
      </label>

      <label class="check wide">
        <input type="checkbox" name="featured" {% if request.form.get('featured') or (article and article.featured) %}checked{% endif %}>
        Exibir como destaque principal
      </label>
    </div>

    <div class="form-actions">
      <button class="button" type="submit">Salvar notícia</button>
      <a class="button ghost" href="{{ url_for('admin_dashboard') }}">Cancelar</a>
    </div>
  </form>
</section>
{% endblock %}
